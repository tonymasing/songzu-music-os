<svg xmlns="http://www.w3.org/2000/svg" width="560" height="72" viewBox="0 0 560 72">
  <defs>
    <filter id="pink" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b1"/>
      <feFlood flood-color="#ff2d95"/><feComposite in2="b1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b2"/>
      <feFlood flood-color="#ff2d95" flood-opacity="0.7"/><feComposite in2="b2" operator="in" result="g2"/>
      <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyan" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#1ee8ff" flood-opacity="0.8"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
    <text x="4" y="46" font-size="36" font-weight="800" letter-spacing="3" fill="#ffe3f1" filter="url(#pink)">創作は生き方だ。</text>
    <g filter="url(#cyan)" fill="#bff8ff" font-size="12" font-weight="600" letter-spacing="2">
      <text x="340" y="28">限界は、次のテイクで超えろ。</text>
      <text x="340" y="50">自分の音を、最後まで信じろ。</text>
    </g>
    <g stroke="#1ee8ff" stroke-width="1.5" opacity="0.8" filter="url(#cyan)">
      <line x1="322" y1="16" x2="322" y2="56"/>
    </g>
  </g>
</svg>
