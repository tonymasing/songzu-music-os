<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72">
  <defs>
    <filter id="cyan" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b1"/>
      <feFlood flood-color="#1ee8ff"/><feComposite in2="b1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b2"/>
      <feFlood flood-color="#1ee8ff" flood-opacity="0.6"/><feComposite in2="b2" operator="in" result="g2"/>
      <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pink" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b"/>
      <feFlood flood-color="#ff2d95" flood-opacity="0.85"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#pink)" fill="#ff5cb8">
    <rect x="6" y="40" width="4" height="16"/><rect x="14" y="30" width="4" height="26"/><rect x="22" y="36" width="4" height="20"/>
    <rect x="30" y="22" width="4" height="34"/><rect x="38" y="32" width="4" height="24"/><rect x="46" y="26" width="4" height="30"/>
    <rect x="54" y="38" width="4" height="18"/><rect x="62" y="30" width="4" height="26"/><rect x="70" y="42" width="4" height="14"/>
  </g>
  <g font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
    <text x="92" y="44" font-size="26" font-weight="800" letter-spacing="3" fill="#e6fdff" filter="url(#cyan)">鳴らし続けろ。</text>
    <text x="94" y="62" font-size="9" font-weight="600" letter-spacing="3" fill="#ff8fd0" filter="url(#pink)">今日の一音が、明日の自分をつくる。</text>
  </g>
  <g stroke="#ff2d95" stroke-width="2" opacity="0.85" filter="url(#pink)">
    <line x1="300" y1="16" x2="290" y2="30"/><line x1="312" y1="16" x2="302" y2="30"/><line x1="324" y1="16" x2="314" y2="30"/><line x1="336" y1="16" x2="326" y2="30"/>
  </g>
</svg>
