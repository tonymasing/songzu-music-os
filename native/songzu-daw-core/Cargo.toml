[package]
name = "songzu-daw-core"
version = "0.4.0"
edition = "2021"
description = "Local-first DAW core service skeleton for Songzu Music OS."
license = "MIT"

[dependencies]
cpal = "0.15.3"
hound = "3.5.1"
fs2 = "0.4.3"
rtrb = "0.3.2"
rodio = { version = "0.20.1", features = ["symphonia-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
